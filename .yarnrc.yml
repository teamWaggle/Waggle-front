enableGlobalCache: false

nodeLinker: pnp

packageExtensions:
  "@storybook/core-common@*":
    dependencies:
      "@storybook/react-webpack5": ^7.2.2

yarnPath: .yarn/releases/yarn-4.1.1.cjs
supportedArchitectures:
    os:
        - 'darwin'
        - 'linux'
        - 'win32'
    cpu:
        - 'arm'
        - 'arm64'
        - 'x64'
